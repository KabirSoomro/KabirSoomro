<svg width="100%" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Ghulam Kabir Soomro — Front-End Developer, Flutter and AI/ML Explorer</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1760"/>
      <stop offset="50%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#00C9FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <path fill="#ffffff" opacity="0.07">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="
        M0,225 C300,190 900,255 1200,215 L1200,260 L0,260 Z;
        M0,215 C300,255 900,190 1200,225 L1200,260 L0,260 Z;
        M0,225 C300,190 900,255 1200,215 L1200,260 L0,260 Z
      "/>
  </path>
  <path fill="#ffffff" opacity="0.05">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="
        M0,240 C400,210 800,250 1200,225 L1200,260 L0,260 Z;
        M0,225 C400,250 800,210 1200,240 L1200,260 L0,260 Z;
        M0,240 C400,210 800,250 1200,225 L1200,260 L0,260 Z
      "/>
  </path>

  <text x="600" y="115" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" font-size="46" font-weight="700" fill="#ffffff" opacity="0">
    Ghulam Kabir Soomro
    <animate attributeName="opacity" from="0" to="1" dur="1.1s" begin="0.1s" fill="freeze"/>
  </text>

  <text x="600" y="160" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" font-size="19" fill="#E4D9FF" opacity="0">
    Front-End Developer • Flutter &amp; AI/ML Explorer
    <animate attributeName="opacity" from="0" to="1" dur="1.1s" begin="0.7s" fill="freeze"/>
  </text>

  <circle cx="600" cy="196" r="3" fill="#00C9FF" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" dur="2s" begin="1.4s" repeatCount="indefinite"/>
  </circle>
